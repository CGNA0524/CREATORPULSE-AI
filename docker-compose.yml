version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: creatorpulse-db
    restart: always
    environment:
      POSTGRES_USER: creatorpulse_user
      POSTGRES_PASSWORD: creatorpulse_password
      POSTGRES_DB: creatorpulse_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U creatorpulse_user -d creatorpulse_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - creatorpulse-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: creatorpulse-backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://creatorpulse_user:creatorpulse_password@db:5432/creatorpulse_db
      - SECRET_KEY=production_secure_jwt_secret_change_me
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      - ENVIRONMENT=production
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - creatorpulse-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: creatorpulse-frontend
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - INTERNAL_API_URL=http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - creatorpulse-net

volumes:
  postgres_data:
    driver: local

networks:
  creatorpulse-net:
    driver: bridge
